name: sharelib
services:
  auth-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${AUTH_DATABASE_PASSWORD:?Set AUTH_DATABASE_PASSWORD in .env}
    volumes: [auth_db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U auth -d auth']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  repository-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: repository
      POSTGRES_USER: repository
      POSTGRES_PASSWORD: ${REPOSITORY_DATABASE_PASSWORD:?Set REPOSITORY_DATABASE_PASSWORD in .env}
    volumes: [repository_db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U repository -d repository']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  auth:
    image: ${AUTH_IMAGE:-ghcr.io/sharelib-jp/auth-service:latest}
    build: {context: ../../auth-service}
    environment:
      OAUTH_HMAC_SECRET: ${OAUTH_HMAC_SECRET:?Set OAUTH_HMAC_SECRET in .env}
      OAUTH_CLIENT_SECRET: ${REPOSITORY_OIDC_CLIENT_SECRET:?Set REPOSITORY_OIDC_CLIENT_SECRET in .env}
    volumes:
      - ./runtime/auth/config.toml:/app/config.toml:ro
      - auth_keys:/app/keys
    depends_on:
      auth-db: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/.well-known/nodeinfo]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  repository:
    image: ${REPOSITORY_IMAGE:-ghcr.io/sharelib-jp/repository-service:latest}
    build: {context: ..}
    environment:
      REPOSITORY_OIDC_CLIENT_SECRET: ${REPOSITORY_OIDC_CLIENT_SECRET:?Set REPOSITORY_OIDC_CLIENT_SECRET in .env}
    volumes:
      - ./runtime/repository/config.toml:/app/config.toml:ro
    depends_on:
      auth-db: {condition: service_healthy}
      repository-db: {condition: service_healthy}
      auth: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8081/.well-known/nodeinfo]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  gateway:
    image: caddy:2-alpine
    environment:
      AUTH_DOMAIN: ${AUTH_DOMAIN:?Set AUTH_DOMAIN in .env}
      REPOSITORY_DOMAIN: ${REPOSITORY_DOMAIN:?Set REPOSITORY_DOMAIN in .env}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        aliases:
          - ${AUTH_DOMAIN}
          - ${REPOSITORY_DOMAIN}
    depends_on:
      auth: {condition: service_healthy}
      repository: {condition: service_healthy}
    restart: unless-stopped
volumes:
  auth_db:
  repository_db:
  auth_keys:
  caddy_data:
  caddy_config:
